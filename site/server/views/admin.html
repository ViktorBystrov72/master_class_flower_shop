<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Кабинет владельца — Аленький цветочек</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/styles.css"><script src="/admin.js" type="module"></script></head>
<body><header class="admin-header"><a class="brand" href="/"><img src="/favicon.svg" width="32" height="32" alt=""><span>Аленький цветочек<small>КАБИНЕТ ВЛАДЕЛЬЦА</small></span></a><div><a href="/" target="_blank" rel="noopener">Открыть витрину ↗</a><form action="/admin/logout" method="post"><button type="submit" class="button secondary">Выйти</button></form></div></header>
<main class="admin-main"><div class="admin-title"><div><p class="eyebrow">ВАШ ЦВЕТОЧНЫЙ МАГАЗИН</p><h1>Всё расцветает.</h1><p id="analytics-period">Показатели за последние семь дней · Тюмень</p></div><button class="button secondary" id="refresh">Обновить ↻</button></div><div id="admin-error" class="error" role="alert" hidden></div><section id="stats" class="stats" aria-label="Показатели за семь дней"></section><div class="analytics-details"><section class="chart-card"><h3>Заказы по дням</h3><div id="daily-chart" class="bars"></div></section><section class="top-card"><h3>Три любимых букета</h3><div id="top-products"></div></section></div><div class="admin-tabs" role="tablist" aria-label="Управление магазином"><button class="admin-tab active" role="tab" id="orders-tab" aria-controls="orders-section" aria-selected="true">Заказы <span id="orders-count"></span></button><button class="admin-tab" role="tab" id="products-tab" aria-controls="products-section" aria-selected="false">Букеты</button></div><section id="orders-section" role="tabpanel" aria-labelledby="orders-tab"><div class="admin-section-title"><h2>Заказы</h2><select id="order-filter" class="filter-select" aria-label="Фильтр заказов по статусу"><option value="all">Все статусы</option><option value="new">Новые</option><option value="accepted">Принятые</option><option value="completed">Выполненные</option></select></div><div id="orders-list" class="orders-list"></div></section><section id="products-section" role="tabpanel" aria-labelledby="products-tab" hidden><div class="admin-section-title"><h2>Ваши букеты</h2><button class="button primary" id="new-product">Добавить букет +</button></div><div id="admin-products" class="admin-products"></div></section></main>
<div class="toast" id="toast" role="status" hidden></div><dialog class="edit-dialog" id="product-dialog" aria-labelledby="edit-title"><div class="dialog-heading"><h2 id="edit-title">Новый букет</h2><button class="icon-button" id="close-edit" aria-label="Закрыть редактор">×</button></div><form id="product-form"><input name="id" type="hidden"><label>Название<input name="name" required minlength="2" maxlength="100" placeholder="Название букета"></label><div class="form-grid"><label>Категория<input name="category" required minlength="2" maxlength="40" list="category-options" placeholder="Например, Нежные"><datalist id="category-options"></datalist></label><label>Метка <span class="muted">· необязательно</span><input name="label" maxlength="40" placeholder="Например, Сезонный"></label></div><label>Описание<textarea name="description" required minlength="5" maxlength="400" rows="3" placeholder="Какие цветы и для какого настроения"></textarea></label><div class="form-grid"><label>Цена, ₽<input name="price" type="number" required min="1" max="1000000" step="1"></label><label>В наличии, шт.<input name="stock" type="number" required min="0" max="10000" step="1"></label></div><label>Фотография<select name="image"><option value="/images/morning.png">Нежное утро · розовые розы</option><option value="/images/sunset.png">Персиковый закат · коралловые цветы</option><option value="/images/cloud.png">Белое облако · белые цветы</option><option value="/images/lilac.png">Сиреневое письмо · лавандовые цветы</option><option value="/images/garden.png">Сад в ладонях · садовый букет</option><option value="/images/red.png">Аленький цветочек · красные розы</option></select></label><img id="product-preview" class="admin-product-preview" src="/images/morning.webp" alt="Предпросмотр выбранной фотографии" width="80" height="80"><label class="checkbox"><input name="visible" type="checkbox" checked><span>Показывать букет на витрине</span></label><div id="product-error" class="error" role="alert" hidden></div><button class="button primary full" id="save-product" type="submit">Сохранить букет ↗</button></form></dialog></body></html>
